    <div class="notif-page">
      <h1 class="noti-title">Notifications</h1>

      <div class="notification-item-admin">
        <div class="not-details">
          <label for="name">Enter the name of the user:</label>
          <input type="text" id="name" /><br /><br />

          <label for="email">Enter the email of the user:</label>
          <input type="email" id="email" /><br /><br />

          <label for="name">Enter the name of the book:</label>
          <input type="text" id="book" /><br /><br />

          <input
            type="button"
            value="Reminder"
            onclick="sendReminder()"
            id="reminder"
          />
          <input
            type="button"
            value="Last Item"
            onclick="lastItem()"
            id="last-item"
          />
          <input
            type="button"
            value="New book"
            onclick="newBook()"
            id="newbook"
          />
        </div>
      </div>
