<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Store</title>
  <link rel="stylesheet" href="book page admin.css">
  

  
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
        <a href="home.html" class="brand">LitHub</a>
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="privacy.html">Privacy</a></li>
            <li><a href="#">Help</a></li>
        </ul>
    </div>
  </nav>
    
  <div class="container">
    

    <!-- Left Form Section -->
    <div class="form-section">
      <h1 class="title">Edit Books</h1>
      <p class="subtitle">Add the book information below</p>

      <div class="form-group">
        <label for="name">Book Name</label>
        <input type="text" id="name" placeholder="e.g. Atomic Habits" />
      </div>

      <div class="form-group">
        <label for="id">Book ID</label>
        <input type="text" id="id" placeholder="e.g. 1234" />
      </div>

      <div class="form-group">
        <label for="author">Author</label>
        <input type="text" id="author" placeholder="e.g. James Clear" />
      </div>

      <div class="form-group">
        <label for="price">Price</label>
        <input type="number" id="price" placeholder="$20" />
      </div>

      <div class="checkbox-group">
        <label for="available">
          <input type="checkbox" id="available" />
          <span class="checkmark"></span>
          Available?
        </label>
      </div>

      <div class="form-group">
        <label for="description">Book Description</label>
        <textarea id="description" placeholder="Write a short description..."></textarea>
      </div>

      <div class="button-group">
        <input type="button" value="Delete Book" />
        <input type="button" value="Add Book" />
        <input type="button" value="Discard" />
      </div>
    </div>

</body>
</html>
