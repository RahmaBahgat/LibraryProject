<!-- signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LitHub - Sign Up</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="#" class="brand">LitHub</a>
        <ul class="nav-links">
            <li><a href="#">About</a></li>
            <li><a href="#">Privacy</a></li>
            <li><a href="#">Help</a></li>
        </ul>
    </nav>

    <main class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Join LitHub</h1>
                <p>Start your literary journey with us</p>
            </div>
            
            <form class="login-form">
                <div class="form-group">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" required>
                </div>

                <div class="form-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" required>
                </div>

                <div class="agreement-section">
                    <p class="terms-text">
                        By creating an account, you agree to the LitHub 
                        <a href="#">Terms of Service</a> and 
                        <a href="#">Privacy Policy</a>.
                    </p>
                    
                    <label class="remember-me">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        I want to receive updates about LitHub
                    </label>
                </div>

                <button type="submit" class="login-button">Create Account</button>
            </form>

            <div class="divider">
                <span class="divider-text">OR</span>
            </div>

            <div class="secondary-options">
                <p>Already have an account? <a href="index.html">Log In</a></p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2025 LitHub</p>
    </footer>
</body>
</html>
