<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Store</title>
  <link rel="stylesheet" href="phase1.css" />
</head>
<body>

  <h1 class="title" style="text-align: center; margin-bottom: 2rem;">Welcome to the Book Store</h1>

  <!-- Wrapper to align image right -->
  <div style="display: flex; justify-content: space-between; align-items: flex-start; padding: 0 2rem;">
    <div style="flex: 1;">
      <h2>Book details:</h2><br>

      <h2 class="details">Book name:
        <input type="text" style="height: 22px; width: 200px; background-color:#d1c7bd;">
      </h2>

      <h2 class="details">Book id:
        <input type="text" style="height: 22px; width: 200px; background-color:#d1c7bd;">
      </h2>

      <h2 class="details">Author:
        <input type="text" style="height: 22px; width: 200px; background-color:#d1c7bd;">
      </h2>

      <h2 class="details">Price:
        <input type="number" style="height: 22px; width: 80px; background-color:#d1c7bd;">
      </h2>

      <h2 class="details">Available?:
        <input type="checkbox">
      </h2>

      <h2 class="details">Book description:<br>
        <input type="text" style="height: 200px; width: 400px; background-color: #d1c7bd">
      </h2>

      <h2 class="button">
        <input type="button" value="Add Book" style="height: 30px; width: 120px ; background-color:#ac9c8d ; font-size: medium;" >
      </h2>
      <h2 class="button">
        <input type="button" value="Delete Book" style="height: 30px; width: 120px ; background-color:#ac9c8d ; font-size: medium;" >
      </h2>
      <h2 class="button">
        <input type="button" value="Discard Changes" style="height: 30px; width: 120px ; background-color:#ac9c8d ; font-size: medium;">
      </h2>
    </div>

    <!-- Image floated to the right -->
    <div style="flex-shrink: 0; margin-left: 2rem;">
      <img src="bookstore.jpg" alt="Book Store Logo" class="image" style="width: 300px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);">
    </div>
  </div>

</body>
</html>
