<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Store</title>
  <link rel="stylesheet" href="phase1.css" />
</head>
<body>

  <h1 class="title">Welcome to the Book Store</h1>
  <h2>Book details:</h2>

  <h2 class="details">Book name: <input type="text" /></h2>
  <h2 class="details">Book ID: <input type="text" /></h2>
  <h2 class="details">Author: <input type="text" /></h2>
  <h2 class="details">Price: <input type="number" /></h2>
  <h2 class="details">Available?: <input type="checkbox" /></h2>
  <h2 class="details">Book description:<br>
    <textarea></textarea>
  </h2>

  <div class="button">
    <input type="button" value="Add Book" />
    <input type="button" value="Delete Book" />
    <input type="button" value="Discard Changes" />
  </div>

</body>
</html>
