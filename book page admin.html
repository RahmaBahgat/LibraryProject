<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>book store</title>
    <link rel="stylesheet" href="phase1.css">
</head>
<body>
    <h1 class="title">Welcome to the Book Store</h1>
    <h2>Book details:</h2><br>
    <img src="bookstore.jpg" alt="Book Store Logo" class="image">
    <h2 class="details">Book name:<input type="text" style="height: 22px; width: 200px; background-color:#d1c7bd;"></h2>
    <h2 class="details">Book id:<input type="text" style="height: 22px; width: 200px;background-color:#d1c7bd;"></h2>
    <h2 class="details">Author:<input type="text" style="height: 22px; width: 200px;background-color:#d1c7bd;"></h2>
    <h2 class="details">Price:<input type="number" style="height: 22px; width: 80px;background-color:#d1c7bd;"></h2>
    <h2 class="details">Avilable?:<input type="checkbox"></h2>
    <h2 class="details">book description:<br><input type="text" style="height: 200px; width: 400px; background-color: #d1c7bd"></h2>
    <h2 class="button"> <input type="button" value="Add Book" style="height: 30px; width: 120px ; background-color:#ac9c8d ; font-size: medium;" ></h2>
    <h2 class="button"> <input type="button" value="Delete Book" style="height: 30px; width: 120px ; background-color:#ac9c8d ; font-size: medium;" ></h2>
    <h2 class="button"><input type="button" value="discard changes" style="height: 30px; width: 120px ; background-color:#ac9c8d ; font-size: medium;"></h2>
</body>
</html>
