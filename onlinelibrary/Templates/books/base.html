{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Book Management{% endblock %}</title>
    
    <!-- Common CSS -->
    <link href="{% static 'css/Navbar_Footer.css' %}" rel="stylesheet">
    <link href="{% static 'css/book page admin.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wgh@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <!-- Logo -->
            <div class="nav-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
                <span>InOtherWords</span>
            </div>

            <!-- Search Bar -->
            <div class="nav-search">
                <form id="searchForm">
                    <input type="text" placeholder="Search books..." aria-label="Search books">
                    <button type="submit" aria-label="Search">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="M21 21l-4.35-4.35"></path>
                        </svg>
                    </button>
                </form>
            </div>

            <!-- Mobile Menu Toggle -->
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- Navigation Menu -->
            <div class="nav-menu">
                <a href="{% url 'books_admin:admin_home' %}" class="nav-link">Dashboard</a>
                <a href="{% url 'books_admin:add_book' %}" class="nav-link">Add Book</a>
                <a href="{% url 'profile' %}" class="nav-link">Profile</a>
            </div>
        </div>
    </nav>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}

    <!-- Common JS -->
    <script src="{% static 'js/Navbar_Footer.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
